name: Configuration CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/validate_config.py
