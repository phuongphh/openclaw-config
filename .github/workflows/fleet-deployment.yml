name: Fleet deployment safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_fleet_deployment.py' -v
